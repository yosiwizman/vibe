name: Bug Report
description: File a bug report
title: "[Title here. keep it short]"
labels: ["bug"]
assignees:
    - octocat
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to fill out this bug report!
              Note: issue reporting is disabled for PrivateNote Therapist V1 (a contact/support channel is pending founder setup).
              For local diagnostics, see docs/debug.md.

    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description: Also tell us, what did you expect to happen?
          placeholder: Tell us what you see!
          value: "A bug happened!"
      validations:
          required: true
    - type: textarea
      id: steps-to-reproduce
      attributes:
          label: Steps to reproduce
          description: Also tell us, what did you expect to happen?
          placeholder: Tell us what you see!
          value: |
              1. step one...
              2. step two...
      validations:
          required: true
    - type: dropdown
      id: browsers
      attributes:
          label: What OS are you seeing the problem on?
          multiple: true
          options:
              - Window
              - Linux
              - MacOS
    - type: textarea
      id: logs
      attributes:
          label: Relevant log output
          description: |
              Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.

          render: shell
