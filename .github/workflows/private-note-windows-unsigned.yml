# PrivateNote Therapist — Windows Unsigned Artifact (Route A)
#
# Founder-approved Route A: build an UNSIGNED Windows binary on GitHub-hosted windows-latest and upload it
# ONLY as a private GitHub Actions artifact. No signing, no notarization, no secrets, no public release,
# no updater/telemetry keys. Mirrors the project's proven toolchain (Node 22 / pnpm 10.4.1 / uv / Rust MSVC
# + scripts/pre_build.py for Windows sidecars) but uses `tauri build --no-bundle` for a deterministic raw
# .exe proof (NSIS installer is a documented follow-up).
name: PrivateNote Windows Unsigned Artifact

on:
  workflow_dispatch:
  pull_request:
    branches: [harness/baseline-v3.0.19]

# Least privilege: read-only; no release/publish permissions.
permissions:
  contents: read

jobs:
  windows-unsigned:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install
        working-directory: ./desktop

      - name: Provision Windows sidecars (pre_build.py)
        run: uv run scripts/pre_build.py --target x86_64-pc-windows-msvc

      # UNSIGNED build only. No tauri-action (which creates releases); no signing/updater/analytics env.
      - name: Build unsigned Windows binary (no bundle)
        run: pnpm exec tauri build --no-bundle
        working-directory: ./desktop

      - name: Locate built artifact
        shell: pwsh
        run: |
          Write-Host "Searching for vibe.exe under target/ ..."
          Get-ChildItem -Path . -Recurse -Filter vibe.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "release" } |
            ForEach-Object { Write-Host "FOUND: $($_.FullName)  ($([math]::Round($_.Length/1MB,1)) MB)" }

      - name: Upload unsigned Windows artifact (GitHub Actions artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: private-note-windows-unsigned-x64
          path: |
            target/release/vibe.exe
            desktop/src-tauri/target/release/vibe.exe
            target/x86_64-pc-windows-msvc/release/vibe.exe
          if-no-files-found: warn
          retention-days: 7
